[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mksync"
version = "0.1.4"
description = ""
authors = [{ name = "Niklas Rosenstein", email = "rosensteinniklas@gmail.com" }]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
keywords = []
classifiers = []
dependencies = ["python-adjudicator>=0.3.1,<0.4"]

[project.urls]
"Bug Tracker" = "https://github.com/NiklasRosenstein/mksync/issues"
Repository = "https://github.com/NiklasRosenstein/mksync"

[project.scripts]
mksync = "mksync.__main__:main"

[tool.uv]
dev-dependencies = [
    "black",
    "flake8",
    "isort",
    "mypy",
    "pycln>=2.1.3,<3",
    "pytest",
]

[tool.hatch.build.targets.sdist]
include = ["src/mksync"]

[tool.hatch.build.targets.wheel]
include = ["src/mksync"]

[tool.hatch.build.targets.wheel.sources]
"src/mksync" = "mksync"

[tool.slap]
typed = true

[tool.slap.release]
pre-commit = "mksync README.md -i && mksync README.md -i && git add README.md"

[tool.slap.test]
check = "slap check"
black = "black --check src/ tests/"
flake8 = "flake8 src/ tests/"
isort = "isort --check-only src/ tests/"
mypy = "dmypy run src/"
pycln = "pycln src/ tests/ --check"
pytest = "pytest tests/ -vv"

[tool.slap.run]
fmt = "pycln src/ tests/ && black src/ tests/ && isort src/ tests/"

[tool.mypy]
python_version = "3.10"
explicit_package_bases = true
mypy_path = ["src"]
namespace_packages = true
pretty = true
show_error_codes = true
show_error_context = true
strict = true
warn_no_return = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true

[tool.isort]
profile = "black"
line_length = 120
combine_as_imports = true

[tool.black]
line-length = 120
